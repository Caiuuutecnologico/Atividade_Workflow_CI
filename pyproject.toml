[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ci-tasks-api"
version = "1.0.0"
description = "REST API de tarefas para demonstrar um workflow CI com PostgreSQL."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2.0",
  "build>=1.2,<2.0",
  "httpx>=0.27,<1.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=9.0.3,<10.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]
